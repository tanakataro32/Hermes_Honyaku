# /etc/lighttpd/honyaku.conf
# Hermes Honyaku は /mnt/smb_data/htdocs/honyaku に置くが、画面は自前のポート 8765 で出すので
# lighttpd (ポート 80) からは何も見せない (logs/ の思考ログ・config.local.ini・.git/ などを URL で取らせない)。
#   sudo cp lighttpd-honyaku.conf /etc/lighttpd/honyaku.conf
#   grep -q '"/etc/lighttpd/honyaku.conf"' /etc/lighttpd/lighttpd.conf || echo 'include "/etc/lighttpd/honyaku.conf"' | sudo tee -a /etc/lighttpd/lighttpd.conf
#   sudo lighttpd -tt -f /etc/lighttpd/lighttpd.conf && sudo systemctl restart lighttpd
#   curl -sI http://127.0.0.1/honyaku/config.ini | head -1    # → 403 Forbidden
# 2 行目: lighttpd.conf の「最後」にこのファイルを読み込む行を 1 回だけ足す (途中に置くと、後ろの
# server.modules = (...) で mod_access が消える)。conf-enabled/ には置かない: Debian 標準の lighttpd.conf は
# conf-enabled/*.conf を読むので、置くと 2 回読まれて lighttpd が起動しなくなる (Duplicate config variable)。
# url.access-deny には mod_access が要る (読み込み済みでも += で重ねて問題ない。無いと警告だけで無視される)
server.modules += ( "mod_access" )
$HTTP["url"] =~ "^/honyaku(/|$)" {
    url.access-deny = ( "" )
}
