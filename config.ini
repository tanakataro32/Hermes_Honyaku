; Hermes Honyaku 設定ファイル (既定値。git pull で更新される)
; 変更したい項目は同じフォルダの config.local.ini に書くと、こちらより優先され、更新でも消えない。
;   例: config.local.ini
;       [proxy]
;       listen_host = 0.0.0.0
; 変更後は sudo systemctl restart hermes-honyaku で反映。

[proxy]
; Hermes Agent がつなぐ先。Hermes と同じマシンなら 127.0.0.1 のままでよい。
; Docker 内の Open WebUI や別マシンからも使う場合は 0.0.0.0 にする (README「Open WebUI も同じ画面で見る」)。
listen_host = 127.0.0.1
listen_port = 8081
; 本体の llama-server (router モードのまま。model 名や API キーはそのまま素通しする)
upstream = http://127.0.0.1:8080
; 上流からの応答待ちの上限 (秒)。長い思考に備えて大きめ
timeout = 600

[ui]
; ブラウザ表示。Windows 機や Tailscale から見るので 0.0.0.0
listen_host = 0.0.0.0
listen_port = 8765
; 画面を開いたとき、直近何ターン分をさかのぼって表示するか
replay_turns = 5
; コンテキストメータの上限 (モデルの --ctx-size と合わせる。80% 超で黄色に光る)
ctx_limit = 200000
; スマホ表示のメニュー […] に出す本棚へのリンク (新しいタブで開く)。空欄でリンクを出さない
hondana_url = http://llmsv/hondana

[translator]
; openai = OpenAI 互換サーバー (Windows 機の llama-server など)
; deepl  = DeepL API (deepl_key が必要)
; none   = 翻訳しない (原文だけ流す。動作確認用)
engine = openai
url = http://192.168.1.8:8082/v1
model = honyaku
api_key =
; 同時に投げる文の数。翻訳側 llama-server の --parallel と合わせる
workers = 3
timeout = 120
temperature = 0.2
deepl_key =
deepl_url = https://api-free.deepl.com/v2/translate

[segment]
; 1 区切りがこの文字数を超えたら、文の切れ目が無くても強制的に分割
max_chars = 500
; この文字数がたまるまでは文末や改行でも区切らず、次の文とまとめて翻訳する
; (短い断片を渡すと小型モデルが作文しやすい。空行 = 段落の切れ目は常に区切る)
min_chars = 120
; 思考がこの秒数止まったら、区切りが無くても溜まった分を翻訳に回す
idle_flush_sec = 2.0
; コマンド / プログラムコードの行は翻訳せず原文のまま出す (行頭のコマンド名・シェル記号・言語の構文から自動判定)。
; 判定に加えたいコマンド名 (行頭の語) があれば空白区切りで追加する。例: code_words = hermes llama-bench
code_words =

[gpu]
; ヘッダーに GPU 温度・VRAM 使用量を表示 (nvidia-smi から読み取り)。
; 複数枚ある場合はすべて表示される (2 枚目を増設しても設定変更は不要)
; nvidia-smi がない環境では自動的に表示されません
; 読み取り間隔 (秒)
interval = 2
; 電力バーの最大値 (W)。観測値がこれを超えた場合は、その観測値がリアルタイムで最大値に上がります
power_max = 250
; カードごとの名前 (任意)。「UUID の頭 = 名前」をコンマで区切って書いた順に並べます (UUID は nvidia-smi -L)。
; 空なら型名 (V100 など) で、同じ型の 2 枚目以降は nvidia-smi の番号順に「V100 (2)」。
; 番号は挿す場所で入れ替わるので、ファン制御などと名前をそろえたいときに書きます。名前は履歴の記録のキーにもなります
;   例: labels = GPU-988a561d = V100, GPU-76ab8bcd = V100-2, GPU-7b4c4762 = PG500
labels =

[power]
; サーバの「⚡ 電力 (推定)」。コンセント側の消費電力の見込みを出します (±15% くらい)
;   = (GPU の実測 + CPU の実測 + その他) ÷ 電源の効率
; GPU は nvidia-smi、CPU はソケット全体の実測です。
; CPU の読み方: auto (rapl → amdgpu の順で読めた方) / rapl (powercap、ふつうは root しか読めない) /
;   amdgpu (Ryzen の内蔵 GPU のドライバが出す PPT、一般ユーザーで読める) / none
cpu_source = auto
; マザーボード・メモリ・SSD・ファンなど、測れない部品の見込み (W)。
; llmsv (X870E Taichi Lite・DDR5 4 枚・NVMe 2 枚・ファンとポンプ) は 50W くらい
other_w = 50
; 電源ユニットの効率 (0〜1)。80 PLUS Gold の中ほどの負荷で 0.90 くらい
psu_eff = 0.90
; バーの満杯にする電源の容量 (W)。0 なら出しうる最大の見込み
; (GPU の電力上限の合計 + cpu_max_w + other_w を効率で割ったもの)
psu_w = 0
; CPU の電力の上限 (W)。Ryzen 5 7600 の PPT は 88W
cpu_max_w = 88

[hwmon]
; ハードウェアモニタの専用サーバー (hwmon.py、honyaku-hwmon.service)。Windows のアプリ (windows/HwMonitor) が読む
; 翻訳の中継とは別のプロセス。値の集め方・[power] の見込みは翻訳の画面と同じ
listen_host = 0.0.0.0
listen_port = 8766
; 記録 (SQLite)。htdocs の下に置くと lighttpd から見えるので、ホームの下に置く
db = ~/.local/share/hermes-honyaku/hwmon.sqlite
; 1 分ごとの記録 (履歴のグラフ用) を残す日数。日ごとの電力量 (電気代) はずっと残す
keep_days = 35
; 電気代の単価 (円/kWh)。31 は家電の電気代表示の目安単価。契約の単価 (燃料費調整・再エネ賦課金込み) が分かったら config.local.ini に
price_yen_kwh = 31
; トークン数を数える llama-server (名前=URL をカンマで区切る)。/slots を 0.5 秒ごとに読む
; 名前は [rental] api の名前と合わせる
llama_servers = flashnext=http://127.0.0.1:18090, honyaku=http://127.0.0.1:18093
; 要求ごとの速さを拾う llama-server のログ (名前=systemd のユニット)。アプリの「速度と文脈」の散布図に使う。
; journalctl -u で読むので、hwmon を動かすユーザーが journal を読めること (adm か systemd-journal のグループ)
llama_units = flashnext=flashnext.service, honyaku=honyaku-p40.service

[rental]
; 電気代と比べる「同じだけ推論したら借りるといくらか」。どれも相場の目安 (2026-10 時点) なので、変えるときは config.local.ini に
; ドル円
usd_jpy = 150
; GPU の時間貸し ($/時)。V100 32GB (vast.ai で $0.12〜0.21) + P40 24GB ($0.11) を 2 枚借りた場合
gpu_usd_per_hour = 0.30
; API の従量 ($/100 万トークン、入力/出力)。名前は [hwmon] llama_servers と同じ
;   flashnext: 同じクラスの Qwen3 Next 80B A3B Thinking (OpenRouter) / honyaku: Qwen3 8B 相当
api = flashnext=0.15/1.20, honyaku=0.05/0.20

[sysmon]
; サーバの CPU 使用率・RAM・ディスク使用量 (/proc・statvfs から読み取り)。
; Linux でない環境では自動的に非表示になります
; 読み取り間隔 (秒)
interval = 2

[hstop]
; システムパネルの GPU 行のボタンで実行する hstop (黄 = hstop --list で一覧 → hstop --pid で選んだ作業だけ / 赤 = hstop --all。server-deploy の hstop)。
; 空欄なら PATH → ~/.local/bin/hstop の順に探す (server-deploy の install.sh が作る場所)
path =
; これより時間がかかったら打ち切ってエラー表示 (秒)。hstop --all は本体の起動待ちで最大 30 秒ほどかかる
timeout = 120

[log]
; 原文セグメントと訳文を JSONL で残すフォルダ (空欄で無効)。日付ごとに 1 ファイル
dir = logs
level = INFO

[sources]
; ターンの発信元ラベル。接続元 IP の前方一致で決める (長い方が優先)。
; Open WebUI は X-OpenWebUI-* ヘッダーがあれば、OpenCode は User-Agent が opencode/... なら、それぞれヘッダーだけで判定する。
127.0.0.1 = Hermes
172. = Open WebUI
; どれにも当てはまらないときのラベル (空欄なら IP アドレスをそのまま表示)
default =

[routes]
; 別の llama-server への振り分け。「名前 = 上流の URL」と書くと、http://127.0.0.1:8081/<名前>/v1 に来た要求を
; 先頭の /<名前> を外してその上流へ送る (思考・和訳・コンテキストメータは本体と同じ画面に出る)。
; 例: P40 で動かしている FlashNext 試験サーバー (~/work/p40/flashnext.sh) → OpenCode の baseURL を http://127.0.0.1:8081/p40/v1 に
p40 = http://127.0.0.1:18090
