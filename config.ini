; Hermes Honyaku 設定ファイル (既定値。git pull で更新される)
; 変更したい項目は同じフォルダの config.local.ini に書くと、こちらより優先され、更新でも消えない。
;   例: config.local.ini
;       [proxy]
;       listen_host = 0.0.0.0
; 変更後は sudo systemctl restart hermes-honyaku で反映。

[proxy]
; Hermes Agent がつなぐ先。Hermes と同じマシンなら 127.0.0.1 のままでよい。
; Docker 内の Open WebUI や別マシンからも使う場合は 0.0.0.0 にする (README「Open WebUI も同じ画面で見る」)。
listen_host = 127.0.0.1
listen_port = 8081
; 本体の llama-server (router モードのまま。model 名や API キーはそのまま素通しする)
upstream = http://127.0.0.1:8080
; 上流からの応答待ちの上限 (秒)。長い思考に備えて大きめ
timeout = 600

[ui]
; ブラウザ表示。Windows 機や Tailscale から見るので 0.0.0.0
listen_host = 0.0.0.0
listen_port = 8765
; 画面を開いたとき、直近何ターン分をさかのぼって表示するか
replay_turns = 5

[translator]
; openai = OpenAI 互換サーバー (Windows 機の llama-server など)
; deepl  = DeepL API (deepl_key が必要)
; none   = 翻訳しない (原文だけ流す。動作確認用)
engine = openai
url = http://192.168.1.8:8082/v1
model = honyaku
api_key =
; 同時に投げる文の数。翻訳側 llama-server の --parallel と合わせる
workers = 3
timeout = 120
temperature = 0.2
deepl_key =
deepl_url = https://api-free.deepl.com/v2/translate

[segment]
; 1 区切りがこの文字数を超えたら、文の切れ目が無くても強制的に分割
max_chars = 500
; この文字数がたまるまでは文末や改行でも区切らず、次の文とまとめて翻訳する
; (短い断片を渡すと小型モデルが作文しやすい。空行 = 段落の切れ目は常に区切る)
min_chars = 120
; 思考がこの秒数止まったら、区切りが無くても溜まった分を翻訳に回す
idle_flush_sec = 2.0

[log]
; 原文セグメントと訳文を JSONL で残すフォルダ (空欄で無効)。日付ごとに 1 ファイル
dir = logs
level = INFO

[sources]
; ターンの発信元ラベル。接続元 IP の前方一致で決める (長い方が優先)。
; Open WebUI は X-OpenWebUI-* ヘッダーがあればそれだけで判定する。
127.0.0.1 = Hermes
172. = Open WebUI
; どれにも当てはまらないときのラベル (空欄なら IP アドレスをそのまま表示)
default =
